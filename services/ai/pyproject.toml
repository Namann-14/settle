[project]
name = "ai"
version = "0.1.0"
description = "AI service: LangChain/LangGraph agents for chat and expense extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "langsmith>=0.1.0",
    "langchain-groq>=1.1,<2",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.51.0",
    "httpx>=0.28",
    "groq>=0.37",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
